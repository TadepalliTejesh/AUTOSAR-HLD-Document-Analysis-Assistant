services:
  ollama:
    image: ollama/ollama:latest
    container_name: autosar_ollama
    restart: unless-stopped
    volumes:
      - ollama_data:/root/.ollama
    expose:
      - "11434"
    ports:
      - "${OLLAMA_PORT:-11435}:11434"
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 10s
    networks:
      - autosar_net

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: autosar_backend
    restart: unless-stopped
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      - APP_NAME=AUTOSAR HLD Document Analysis Assistant
      - EMBEDDING_MODEL=BAAI/bge-small-en-v1.5
      - EXPERIMENTAL_EMBEDDING_MODEL=sentence-transformers/all-MiniLM-L6-v2
      - DEFAULT_CHROMA_COLLECTION=autosar_hld_knowledge
      - EXPERIMENTAL_CHROMA_COLLECTION=autosar_hld_knowledge_minilm
      - OLLAMA_BASE_URL=http://ollama:11434
      - OLLAMA_MODEL=llama3.2:3b
      - CHROMA_DIR=/app/data/chroma
      - UPLOAD_DIR=/app/data/uploads
      - EXPORT_DIR=/app/data/exports
      - DATABASE_URL=sqlite:////app/data/autosar.db
      - API_HOST=0.0.0.0
      - API_PORT=8000
      - TOP_K=6
      - MIN_RELEVANCE=0.50
      - HF_HOME=/root/.cache/huggingface
    volumes:
      - ./data:/app/data
      - hf_cache:/root/.cache/huggingface
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - autosar_net

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: autosar_frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    environment:
      - API_BASE_URL=http://backend:8000
    ports:
      - "8501:8501"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8501/_stcore/health"]
      interval: 15s
      timeout: 10s
      retries: 3
      start_period: 15s
    networks:
      - autosar_net

volumes:
  ollama_data:
    name: autosar_ollama_data
  hf_cache:
    name: autosar_hf_cache

networks:
  autosar_net:
    name: autosar_network
    driver: bridge
